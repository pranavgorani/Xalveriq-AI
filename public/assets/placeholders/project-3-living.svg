<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6DFD3" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#F6F2EA"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Architectural framing border -->
  <rect x="24" y="24" width="1152" height="702" fill="none" stroke="#DDD5C8" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Inner card drawing -->
  <rect x="320" y="255" width="560" height="240" fill="#FFFFFF" stroke="#DDD5C8" stroke-width="1" rx="4"/>
  
  <!-- Badge -->
  <rect x="490" y="280" width="220" height="28" fill="#F6F2EA" stroke="#DDD5C8" stroke-width="1" rx="2"/>
  <text x="600" y="299" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#B5573A" text-anchor="middle" letter-spacing="1.5">XALVERIQ STUDIO PLACEHOLDER</text>
  
  <!-- Main label -->
  <text x="600" y="360" font-family="Fraunces, serif" font-size="28" font-weight="400" fill="#1B1B1B" text-anchor="middle">Penthouse Living & Balcony</text>
  
  <!-- Subtitle -->
  <text x="600" y="400" font-family="Inter, sans-serif" font-size="14" fill="#6B665E" text-anchor="middle">Double-height volume, breathable lime plaster & teak louvers</text>
  
  <!-- Instruction -->
  <text x="600" y="450" font-family="Inter, monospace" font-size="12" fill="#B5573A" text-anchor="middle">[ REPLACE WITH REAL XALVERIQ PROJECT PHOTO ]</text>
</svg>